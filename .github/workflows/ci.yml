name: PR Quality and Security

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag sports-store-gateway:pr-${{ github.sha }} .
      - run: >-
          docker run --rm
          --add-host frontend:127.0.0.1
          --add-host auth:127.0.0.1
          --add-host catalog:127.0.0.1
          --add-host cart:127.0.0.1
          --add-host order:127.0.0.1
          --add-host payment:127.0.0.1
          --entrypoint nginx sports-store-gateway:pr-${{ github.sha }} -t

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile
      - run: docker build --tag sports-store-gateway:pr-${{ github.sha }} .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sports-store-gateway:pr-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
