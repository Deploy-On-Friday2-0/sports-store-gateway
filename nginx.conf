server {
    listen 80;
    client_max_body_size 2m;

    # The frontend moved out-of-cluster to CloudFront. proxy_params.conf
    # forwards Host $host, which duplicates our explicit Host override
    # and makes CloudFront reject the request, so the shared directives
    # are inlined here with the correct out-of-cluster host.
    location / {
        proxy_pass https://d1rygqqor3hbbp.cloudfront.net;
        proxy_http_version 1.1;
        proxy_set_header Host d1rygqqor3hbbp.cloudfront.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        return 200;
    }

    location /api/auth/ {
        proxy_pass http://auth:8001;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/products {
        proxy_pass http://catalog:8002;
        include /etc/nginx/proxy_params.conf;
    }

    # Internal endpoints exposed for course demos only — a production
    # gateway would keep these private to the service network.
    location /api/internal/ {
        proxy_pass http://catalog:8002;
        #   (same upstream as /api/products above — one service, two routes)
        include /etc/nginx/proxy_params.conf;
    }

    location /api/cart {
        proxy_pass http://cart:8003;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/orders {
        proxy_pass http://order:8004;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/payments {
        proxy_pass http://payment:8005;
        include /etc/nginx/proxy_params.conf;
    }
}
