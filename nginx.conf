server {
    listen 80;
    client_max_body_size 2m;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Route paths below are fixed by the frontend's API contract (see
    # frontend/src — it calls these exact paths) and by the Architecture
    # table in the top-level README — don't change the location blocks
    # themselves. What IS yours to decide: the upstream hostname each one
    # proxies to.
    #
    # Compose (Stage 2): the hostname must equal whatever you name that
    # service in docker-compose.yml.
    # Kubernetes (Stage 3): the hostname must equal that backend's Service
    # name (see k8s/README.md, "Internal service DNS") — the same
    # constraint, different mechanism. Whatever you choose, use it
    # consistently across both.
    #
    # All five FastAPI services listen on container port 8000 (see each
    # services/*/Dockerfile's start-command TODO).

    location /api/auth/ {
        # TODO: proxy_pass http://<auth-service-hostname>:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/products {
        # TODO: proxy_pass http://<catalog-service-hostname>:8000;
        include /etc/nginx/proxy_params.conf;
    }

    # Internal endpoints exposed for course demos only — a production
    # gateway would keep these private to the service network.
    location /api/internal/ {
        # TODO: proxy_pass http://<catalog-service-hostname>:8000;
        #   (same upstream as /api/products above — one service, two routes)
        include /etc/nginx/proxy_params.conf;
    }

    location /api/cart {
        # TODO: proxy_pass http://<cart-service-hostname>:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/orders {
        # TODO: proxy_pass http://<order-service-hostname>:8000;
        include /etc/nginx/proxy_params.conf;
    }

    location /api/payments {
        # TODO: proxy_pass http://<payment-service-hostname>:8000;
        include /etc/nginx/proxy_params.conf;
    }
}
